services:
  postgres:
    image: postgres:16-alpine
    container_name: capidocs-pg
    environment:
      POSTGRES_USER: capidocs
      POSTGRES_PASSWORD: capidocs
      POSTGRES_DB: capidocs
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capidocs -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - capidocs-pg:/var/lib/postgresql/data

volumes:
  capidocs-pg:
