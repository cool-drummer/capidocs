name: studio image

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - apps/site/**
      - apps/studio/**
      - packages/**
      - pnpm-lock.yaml
      - Dockerfile
      - .dockerignore
      - .github/workflows/studio-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cool-drummer/capidocs-studio

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: capidocs
          POSTGRES_PASSWORD: capidocs
          POSTGRES_DB: capidocs
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U capidocs -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=capidocs-studio
            org.opencontainers.image.description=Backoffice API and studio for capidocs portals
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
